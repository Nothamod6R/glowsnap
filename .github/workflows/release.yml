name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Determine release channel
        id: channel
        run: |
          case "${GITHUB_REF_NAME}" in
            *"-alpha"*)    channel="alpha" ;;
            *"-beta"*)     channel="beta" ;;
            *"-nightly"*)  channel="nightly" ;;
            *)             channel="stable" ;;
          esac
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Prepare release (build + collect artifacts)
        run: ./scripts/release.sh "${GITHUB_REF_NAME}" "${{ steps.channel.outputs.channel }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.channel.outputs.channel != 'stable' }}
          files: |
            release/*/GlowSnap-*-x86_64.AppImage
            release/*/glowsnap-*-linux-amd64
            release/*/SHA256SUMS
