app-id: io.github.libreglow.glowsnap

runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
  - org.freedesktop.Sdk.Extension.node22

command: glowsnap

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=xdg-pictures
  - --filesystem=xdg-videos

modules:
  - name: glowsnap
    buildsystem: simple

    build-options:
      append-path: /usr/lib/sdk/golang/bin:/usr/lib/sdk/node22/bin

    sources:
      - type: dir
        path: ..

    build-commands:
      - |
          set -eux

          export PATH=/usr/lib/sdk/golang/bin:/usr/lib/sdk/node22/bin:$PATH
          export GOFLAGS="-mod=vendor"

          npm install --prefix frontend

          npm run build --prefix frontend

          go run -mod=vendor github.com/wailsapp/wails/v2/cmd/wails \
            build \
            -tags webkit2gtk_4_1 \
            -clean

          install -Dm755 build/bin/glowsnap \
            /app/bin/glowsnap

          install -Dm644 \
            packaging/io.github.libreglow.glowsnap.desktop \
            /app/share/applications/io.github.libreglow.glowsnap.desktop

          install -Dm644 \
            packaging/io.github.libreglow.glowsnap.metainfo.xml \
            /app/share/metainfo/io.github.libreglow.glowsnap.metainfo.xml

          install -Dm644 \
            packaging/io.github.libreglow.glowsnap.png \
            /app/share/icons/hicolor/512x512/apps/io.github.libreglow.glowsnap.png